<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склад AI — Управление складом</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">📦</span>
                <h1 class="text-xl font-bold tracking-wide">Склад AI — Управление складом</h1>
            </div>
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full border border-emerald-500/30">Online</span>
        </div>
    </header>

    <!-- Chat Container -->
    <main class="max-w-4xl w-full mx-auto p-4 flex-1 flex flex-col space-y-4 overflow-y-auto my-4" id="chat-box">
        <!-- Приветственное сообщение -->
        <div class="flex items-start space-x-3">
            <div class="bg-indigo-600 text-white rounded-2xl p-4 max-w-xl shadow-lg">
                <p class="font-medium">Привет! Я твой ИИ-помощник по складу. Спроси меня о наличии деталей, артикулах или остатках на основе таблиц.</p>
            </div>
        </div>
    </main>

    <!-- Quick Buttons / Chips -->
    <div class="max-w-4xl w-full mx-auto px-4 mb-2 flex flex-wrap gap-2">
        <button onclick="sendQuickQuery('Остатки всех деталей')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">📊 Все остатки</button>
        <button onclick="sendQuickQuery('Какие позиции заканчиваются?')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700 transition">⚠️ Дефицит</button>
    </div>

    <!-- Input Form -->
    <footer class="bg-slate-800 border-t border-slate-700 p-4">
        <div class="max-w-4xl mx-auto flex gap-3">
            <input type="text" id="user-input" placeholder="Введите наименование детали или артикул..." 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition"
                onkeydown="if(event.key === 'Enter') sendMessage()">
            <button onclick="sendMessage()" id="send-btn" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white px-6 py-3 rounded-xl font-medium transition flex items-center justify-center shadow-lg">
                Найти
            </button>
        </div>
    </footer>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        function appendMessage(sender, text) {
            const isUser = sender === 'user';
            const wrapper = document.createElement('div');
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'justify-end' : ''}`;
            
            const bubble = document.createElement('div');
            bubble.className = `rounded-2xl p-4 max-w-xl shadow-lg ${isUser ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-100 border border-slate-700'}`;
            
            // Преобразуем переносы строк в блек-тексте
            bubble.innerHTML = `<p class="whitespace-pre-wrap font-medium">${text}</p>`;
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage('user', text);
            userInput.value = '';

            // Индикатор загрузки
            const loadingId = 'loading-' + Date.now();
            const loadingWrapper = document.createElement('div');
            loadingWrapper.id = loadingId;
            loadingWrapper.className = 'flex items-start space-x-3';
            loadingWrapper.innerHTML = `<div class="bg-slate-800 text-slate-400 rounded-2xl p-4 border border-slate-700 animate-pulse">Ищу информацию в таблицах...</div>`;
            chatBox.appendChild(loadingWrapper);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text })
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage('bot', data.reply);
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage('bot', 'Ошибка соединения с сервером.');
            }
        }

        function sendQuickQuery(text) {
            userInput.value = text;
            sendMessage();
        }
    </script>
</body>
</html>
